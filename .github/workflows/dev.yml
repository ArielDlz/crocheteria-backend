name: Deploy Dev

on:
  push:
    branches:
      - dev

jobs:
  deploy:
    runs-on: self-hosted

    concurrency:
      group: project-a-deploy
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@v4

      - name: Sync project
        run: |
          rsync -av --delete ./ /srv/projects/project-a/

      - name: Deploy container
        run: |
          cd /srv/projects/project-a
          docker compose -p project-a up -d --build
